[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "SchemaMechanism"
version = "0.1.0"
description = "A Python version of Drescher's Schema Mechanism"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sean Kugele", email = "seankugele@gmail.com" }]
# keep in sync with the classifiers below and the CI matrix in .github/workflows/tests.yml
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# compatible ranges; the lower bounds were verified as a set on Python 3.12 and 3.13 (exact versions are in uv.lock)
dependencies = [
    "anytree>=2.13,<3",
    "lark>=1.3,<2",
    "numpy>=2.1,<3",
    "pynput>=1.8,<2",
    "pyyaml>=6.0.2,<7",
    "scipy>=1.14.1,<2",
    "optuna>=4.0,<6",
    "pandas>=2.2.3,<4",
]

[project.urls]
Homepage = "https://github.com/kugeles-rhodes/schema-mechanism"

[dependency-groups]
dev = [
    "coverage>=7.16",
]

[tool.setuptools.packages.find]
where = ["src"]
# match setup.py's former find_packages(): only directories with an __init__.py are packages
namespaces = false

[tool.uv]
required-version = ">=0.12.18"
