name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.9 is required: util.py and validate.py import Collection/Iterable from `collections`,
      # which was removed in 3.10.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # examples/__init__.py imports pynput.keyboard, which needs an X display on Linux, so the
      # tests that import `examples` are run under a virtual framebuffer.
      - name: Run unit tests
        run: xvfb-run -a python -m unittest discover -s tests -v
