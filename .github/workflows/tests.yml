name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # keep in sync with requires-python and the classifiers in pyproject.toml
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      # python-version sets UV_PYTHON, which overrides .python-version; uv downloads that Python if needed
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.18'
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml. On Linux, pynput's evdev dependency is compiled
      # from source, which works with the compiler and headers preinstalled on GitHub's Ubuntu runners.
      - name: Install dependencies
        run: uv sync --locked

      # examples/__init__.py imports pynput.keyboard, which needs an X display on Linux, so the
      # tests that import `examples` are run under a virtual framebuffer.
      - name: Run unit tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --locked python -m unittest discover -s tests -v

      - name: Run unit tests
        if: runner.os != 'Linux'
        run: uv run --locked python -m unittest discover -s tests -v

  # Runs each test module on its own, so a module can't silently depend on global state (e.g., the action trace) left
  # behind by modules that happen to run before it in the full suite.
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.18'
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run each test module on its own
        run: |
          failed=0
          for f in tests/test_*.py; do
            module=$(basename "$f")
            if ! xvfb-run -a uv run --locked python -m unittest discover -s tests -p "$module"; then
              echo "::error file=$f::$module fails when run on its own"
              failed=1
            fi
          done
          exit $failed
