name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with python_requires and the classifiers in setup.py
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.py

      # requirements.txt is a full lock (incl. transitive deps); on Linux, pynput's evdev dependency is compiled from
      # source, which works with the compiler and kernel headers preinstalled on GitHub's Ubuntu runners
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # examples/__init__.py imports pynput.keyboard, which needs an X display on Linux, so the
      # tests that import `examples` are run under a virtual framebuffer.
      - name: Run unit tests
        run: xvfb-run -a python -m unittest discover -s tests -v
